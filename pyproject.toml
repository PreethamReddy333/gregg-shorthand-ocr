[project]
name = "gregg-ocr"
version = "0.1.0"
description = "OCR for Gregg shorthand: page images -> Grascii strokes -> English"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "pillow",
    "huggingface_hub",
    "tqdm",
    "grascii",
    "cmudict",
    "opencv-python-headless",
]

[project.optional-dependencies]
train = ["torch", "torchvision", "transformers"]
dsr = ["scipy", "scikit-image", "opencv-python-headless", "matplotlib", "pytest"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
